name: Build Release

on:
  # 2.2.0 assets are built and smoke-tested on the Windows release machine.
  # Keep this legacy CI build manual until its GPU/SDK toolchain is updated;
  # a version tag must not replace the verified release assets with a CI build.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m venv .venv_d
          .\.venv_d\Scripts\python.exe -m pip install --upgrade pip
          .\.venv_d\Scripts\python.exe -m pip install -r requirements.txt

      - name: Run unit tests
        run: |
          .\.venv_d\Scripts\python.exe -m unittest discover -s tests -v

      - name: Build release
        env:
          EOING_SKIP_NATIVE: '1'
        run: .\build_release.ps1

      - name: Install Inno Setup
        run: |
          choco install innosetup -y

      - name: Build installer
        run: .\build_installer.ps1 -Compiler 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EoingPDF-release
          path: release/*
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: EoingPDF-release
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
